name: runner-probe
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  probe:
    runs-on: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        label: [macos-latest, macos-15, macos-13, macos-14, macos-15-intel]
    steps:
      - name: ok
        run: echo "runner ok: $RUNNER_NAME / $RUNNER_ARCH"
